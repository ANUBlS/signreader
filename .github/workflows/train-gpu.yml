name: Train model (Kaggle GPU)

# Sends a training job to a free Kaggle GPU notebook (RTSD dataset attached there, no download).
# "Fetch GPU model" checks every 20 min and, when the notebook is done, publishes the model
# to the "model-latest" release and rebuilds the APK.
#
# Uses the same KAGGLE_USERNAME / KAGGLE_KEY secrets. Your Kaggle account must be
# phone-verified (kaggle.com → Settings → Phone verification) for GPU + internet.
#
# Start: edit/commit training/TRAIN_GPU, or Actions → Train model (Kaggle GPU) → Run workflow.

on:
  push:
    branches: [main]
    paths:
      - 'training/TRAIN_GPU'
  workflow_dispatch:
    inputs:
      hours:
        description: 'Training time on the GPU (Kaggle sessions stop at 12 h)'
        default: '9'
      imgsz:
        description: 'Image size'
        default: '640'

permissions:
  contents: write

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      HOURS: ${{ inputs.hours || '9' }}
      IMGSZ: ${{ inputs.imgsz || '640' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - run: pip install -q kaggle

      - name: Build Kaggle notebook
        run: |
          STAMP="$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_SHA::7}"
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          mkdir -p kernel
          # az_signs.py without its CLI entry point + the Kaggle driver
          python - <<'EOF'
          import os
          src = open("training/az_signs.py", encoding="utf-8").read()
          tail = 'if __name__ == "__main__":\n    main()\n'
          assert src.rstrip().endswith(tail.rstrip()), "unexpected az_signs.py ending"
          src = src.rstrip()[: -len(tail.rstrip())]
          drv = open("training/kaggle_driver.py", encoding="utf-8").read()
          drv = (drv.replace("__HOURS__", os.environ["HOURS"])
                    .replace("__IMGSZ__", os.environ["IMGSZ"])
                    .replace("__STAMP__", os.environ["STAMP"]))
          open("kernel/kernel.py", "w", encoding="utf-8").write(src + "\n\n" + drv)
          EOF
          cat > kernel/kernel-metadata.json <<EOF
          {
            "id": "${KAGGLE_USERNAME}/signreader-train",
            "title": "signreader-train",
            "code_file": "kernel.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_internet": true,
            "dataset_sources": ["watchman/rtsd-dataset"],
            "competition_sources": [],
            "kernel_sources": []
          }
          EOF
          python -m py_compile kernel/kernel.py
          ls -la kernel

      - name: Push notebook to Kaggle
        run: |
          kaggle kernels push -p kernel 2>&1 | tee push.log || true
          grep -qiE "error|invalid|not authori" push.log && exit 1 || true
          sleep 30
          kaggle kernels status "${KAGGLE_USERNAME}/signreader-train" 2>&1 | tee status.log

      - name: Record launch
        if: always()
        run: |
          {
            echo "GPU training launched: $STAMP"
            echo "Hours: $HOURS, imgsz: $IMGSZ"
            echo
            echo '```'
            cat push.log status.log 2>/dev/null || true
            echo '```'
          } > launch.md
          echo "$STAMP" > launch-stamp.txt
          .github/scripts/publish_release.sh gpu-train "GPU training (status)" launch.md launch-stamp.txt
