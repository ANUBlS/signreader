name: Train model (Kaggle GPU)

# Sends a training job to a free Kaggle GPU notebook (RTSD dataset attached there, no download).
# "Fetch GPU model" checks every 20 min and, when the notebook is done, publishes the model
# to the "model-latest" release and rebuilds the APK.
#
# Uses the same KAGGLE_USERNAME / KAGGLE_KEY secrets. Your Kaggle account must be
# phone-verified (kaggle.com → Settings → Phone verification) for GPU + internet.
#
# Start: edit/commit training/TRAIN_GPU, or Actions → Train model (Kaggle GPU) → Run workflow.

on:
  push:
    branches: [main]
    paths:
      - 'training/TRAIN_GPU'
  workflow_dispatch:
    inputs:
      hours:
        description: 'Training time on the GPU (Kaggle sessions stop at 12 h; keep ≤ 8)'
        default: '7'
      imgsz:
        description: 'Image size'
        default: '640'

permissions:
  contents: write

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      HOURS: ${{ inputs.hours || '7' }}
      IMGSZ: ${{ inputs.imgsz || '640' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Build and push Kaggle notebook
        run: |
          set +e
          STAMP="$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_SHA::7}"
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          export STAMP
          bash .github/scripts/launch_kaggle.sh > launch.log 2>&1
          rc=$?
          echo "exit code: $rc" >> launch.log
          # never publish the key, even if a tool echoed it
          sed -i "s/${KAGGLE_KEY}/***/g" launch.log
          cat launch.log
          exit $rc

      - name: Record launch
        if: always()
        run: |
          {
            echo "GPU training launched: $STAMP"
            echo "Hours: $HOURS, imgsz: $IMGSZ"
            echo
            echo '```'
            tail -60 launch.log 2>/dev/null || echo "(no launch.log)"
            echo '```'
          } > launch.md
          echo "$STAMP" > launch-stamp.txt
          [ -f launch.log ] || echo "(no log)" > launch.log
          .github/scripts/publish_release.sh gpu-train "GPU training (status)" launch.md launch-stamp.txt launch.log
